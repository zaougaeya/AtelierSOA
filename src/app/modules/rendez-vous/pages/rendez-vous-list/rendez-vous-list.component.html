<h2 class="mb-3 text-center">Gestion des Rendez-vous</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto" style="max-width: 400px; font-size: 0.85rem;">

  <div class="mb-2">
    <label for="date" class="form-label small mb-1">Date :</label>
    <input id="date" type="date" formControlName="date" class="form-control form-control-sm" [class.is-invalid]="form.controls.date.invalid && form.controls.date.touched" />
    <div *ngIf="form.controls.date.invalid && form.controls.date.touched" class="invalid-feedback small">
      Date requise
    </div>
  </div>

  <div class="mb-2">
    <label for="heure" class="form-label small mb-1">Heure :</label>
    <input id="heure" type="time" formControlName="heure" class="form-control form-control-sm" [class.is-invalid]="form.controls.heure.invalid && form.controls.heure.touched" />
    <div *ngIf="form.controls.heure.invalid && form.controls.heure.touched" class="invalid-feedback small">
      Heure requise
    </div>
  </div>

  <div class="mb-2">
    <label for="logementAdresse" class="form-label small mb-1">Adresse Logement :</label>
    <select id="logementAdresse" formControlName="logementAdresse" class="form-select form-select-sm" [class.is-invalid]="form.controls.logementAdresse.invalid && form.controls.logementAdresse.touched">
      <option value="" disabled selected>-- Choisir une adresse --</option>
      <option *ngFor="let logement of logements" [value]="logement.adresse">
        {{ logement.adresse }}
      </option>
    </select>
    <div *ngIf="form.controls.logementAdresse.invalid && form.controls.logementAdresse.touched" class="invalid-feedback small">
      Adresse requise
    </div>
  </div>

  <div class="mb-3">
    <label for="numTel" class="form-label small mb-1">Téléphone :</label>
    <input id="numTel" type="tel" formControlName="numTel" placeholder="+216xxxxxxxx" class="form-control form-control-sm" [class.is-invalid]="form.controls.numTel.invalid && form.controls.numTel.touched" />
    <div *ngIf="form.controls.numTel.invalid && form.controls.numTel.touched" class="invalid-feedback small">
      Numéro valide requis (6 à 15 chiffres, + optionnel)
    </div>
  </div>

  <div class="d-flex justify-content-center gap-2 mb-4">
    <button type="submit" class="btn btn-primary btn-sm px-3" [disabled]="form.invalid">
      {{ isEditing ? 'Mettre à jour' : 'Ajouter' }}
    </button>
    <button type="button" class="btn btn-secondary btn-sm px-3" (click)="resetForm()" *ngIf="isEditing">Annuler</button>
  </div>

</form>

<hr style="max-width: 400px; margin: 1rem auto;" />

<div class="mx-auto mb-3" style="max-width: 300px;">
  <label for="search" class="form-label small mb-1">Rechercher :</label>
  <input
    id="search"
    [(ngModel)]="searchText"
    (input)="filterList()"
    placeholder="Date, téléphone, adresse logement..."
    class="form-control form-control-sm"
  />
</div>

<div class="table-responsive mx-auto" style="max-width: 600px; font-size: 0.85rem;">
  <table class="table table-striped table-bordered table-hover table-sm mb-0">
    <thead class="table-dark">
      <tr>
        <th style="width: 80px;">Date</th>
        <th style="width: 60px;">Heure</th>
        <th>Adresse Logement</th>
        <th style="width: 120px;">Téléphone</th>
        <th style="width: 110px;">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let rdv of filteredList">
        <td>{{ rdv.date }}</td>
        <td>{{ rdv.heure }}</td>
        <td>{{ rdv.logement.adresse || 'N/A' }}</td>
        <td>{{ rdv.numTel }}</td>
        <td>
          <button type="button" class="btn btn-warning btn-sm me-1 px-2 py-1" (click)="editRendezVous(rdv)">Modifier</button>
          <button type="button" class="btn btn-danger btn-sm px-2 py-1" (click)="deleteRendezVous(rdv.id!)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
